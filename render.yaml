services:
  - type: worker
    name: pitch-toss-ai
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    autoDeploy: true

    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_CHANNEL_ID
        sync: false

      - key: DATABASE_URL
        value: sqlite:///data/pitch_toss_ai.db

      - key: POSTING_INTERVAL_MINUTES
        value: 10

      - key: TIMEZONE
        value: Asia/Kolkata

      - key: AUTO_DELETE_HOURS
        value: 0

      - key: CONFIDENCE_THRESHOLD
        value: 0.52

      - key: PIN_PREDICTIONS
        value: true

      - key: DRY_RUN
        value: false