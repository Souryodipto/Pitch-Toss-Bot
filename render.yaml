services:
  - type: web
    name: pitch-toss-ai
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DRY_RUN
        value: "false"
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: POSTING_INTERVAL_MINUTES
        value: "15"
      - key: RUN_SCAN_ON_STARTUP
        value: "true"
      - key: AUTO_DELETE_HOURS
        value: "8"
      - key: CONFIDENCE_THRESHOLD
        value: "0.52"
      - key: PREDICTION_LEAD_HOURS
        value: "6"
      - key: POST_WITHOUT_START_TIME
        value: "false"
      - key: PIN_PREDICTIONS
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pitch-toss-ai-db
          property: connectionString

databases:
  - name: pitch-toss-ai-db
    plan: starter
